plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.jetbrains.kotlin.jvm'
	id "org.jetbrains.kotlin.plugin.jpa" version '2.4.10'
	id "org.jetbrains.kotlin.plugin.spring" version '2.4.10'
}

group = 'springlab-V1'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'   // ← add this
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'                          // ← add this
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'                            // ← add this
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'                         // ← add this
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test' // ← add this
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

tasks.named('test') {
	useJUnitPlatform()
}