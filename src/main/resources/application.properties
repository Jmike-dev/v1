

spring.datasource.url=jdbc:mysql://localhost:3306/my_django_db
spring.datasource.username=django_user
spring.datasource.password=my_django_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_BASE64_STRING_AT_LEAST_256_BITS
jwt.expiration-ms=3600000